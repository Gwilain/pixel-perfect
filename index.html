<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Perfect</title>
    <link rel="icon" href="./images/pixel-perfect.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="toolbar">
      <img class="app-icon" src="./images/pixel-perfect.svg" alt="" />
      <div class="group">
        <button id="newButton" type="button" title="Start a new empty project">New</button>
        <button id="openButton" type="button" title="Open image">Open</button>
        <button id="captureButton" type="button" title="Capture a browser tab or window">Capture</button>
        <input id="fileInput" type="file" accept="image/*" hidden />
      </div>

      <div class="group" role="toolbar" aria-label="Tools">
        <button class="tool is-active" type="button" data-tool="select" title="Select (V)" aria-label="Select">
          <img src="./images/select.svg" alt="" />
        </button>
        <button class="tool" type="button" data-tool="rect" title="Rectangle (R)" aria-label="Rectangle">
          <img src="./images/rectangle.svg" alt="" />
        </button>
        <button class="tool" type="button" data-tool="distance" title="Distance (D)" aria-label="Distance">
          <img src="./images/distance.svg" alt="" />
        </button>
        <button class="tool" type="button" data-tool="eyedropper" title="Eyedropper (I)" aria-label="Eyedropper">
          <img src="./images/eyedrop.svg" alt="" />
        </button>
        <button class="tool" type="button" data-tool="zoom" title="Zoom (Z)" aria-label="Zoom">
          <img src="./images/zoom.svg" alt="" />
        </button>
        <button class="tool" type="button" data-tool="crop" title="Crop (C)" aria-label="Crop">
          <img src="./images/crop.svg" alt="" />
        </button>
        <button id="applyCrop" type="button" title="Apply crop" hidden>Apply crop</button>
      </div>

      <div class="group">
        <button id="clearMeasurements" type="button" title="Clear measurements and guides">Clear</button>
      </div>

      <div class="group">
        <label class="theory" title="Theoretical width used to scale measurements">
          Theo W
          <input id="theoryWidth" type="number" min="1" step="1" placeholder="px" />
        </label>
        <label class="theory" title="Theoretical height used to scale measurements">
          Theo H
          <input id="theoryHeight" type="number" min="1" step="1" placeholder="px" />
        </label>
        <label class="toggle" title="Show a loupe and snap rectangle and distance points to whole pixels">
          <input id="pixelPerfectMode" type="checkbox" />
          Pixel perfect
        </label>
      </div>

      <div class="group group-right">
        <button id="exportJson" type="button" title="Export measurements as JSON">Export</button>
        <button id="importJson" type="button" title="Import measurements from JSON">Import</button>
        <input id="jsonInput" type="file" accept="application/json,.json" hidden />
        <div class="settings">
          <button id="settingsButton" type="button" title="Settings" aria-label="Settings" aria-haspopup="true" aria-expanded="false">&#8942;</button>
          <section id="settingsPanel" class="settings-panel" aria-label="Settings" hidden>
            <div class="settings-title">Colors</div>
            <label>
              Rectangle
              <input type="color" data-color-setting="rect" />
            </label>
            <label>
              Rectangle selected
              <input type="color" data-color-setting="rectSelected" />
            </label>
            <label>
              Distance
              <input type="color" data-color-setting="distance" />
            </label>
            <label>
              Distance selected
              <input type="color" data-color-setting="distanceSelected" />
            </label>
            <label>
              Guide
              <input type="color" data-color-setting="guide" />
            </label>
            <label>
              Guide selected
              <input type="color" data-color-setting="guideSelected" />
            </label>
            <div class="settings-title settings-title-spaced">Loupe</div>
            <label class="range-setting">
              <span>Frame</span>
              <input id="loupeFrameSize" type="range" min="17" max="37" step="2" />
              <output id="loupeFrameSizeValue"></output>
            </label>
            <label class="toggle setting-toggle" title="Temporarily align measurements with other rectangle edges and distance points">
              <input id="smartGuides" type="checkbox" />
              Smart guides
            </label>
            <label class="toggle setting-toggle" title="Snap rectangle and distance points to manual guides">
              <input id="snapToGuides" type="checkbox" />
              Snap to guides
            </label>
            <button id="resetSettings" type="button">Reset settings</button>
          </section>
        </div>
      </div>
    </header>

    <main id="dropZone" class="workspace">
      <canvas id="stage"></canvas>
      <div id="emptyState" class="empty-state">
        <strong>Drop a screenshot here</strong>
        <span>Open a local image or paste one with Cmd/Ctrl+V.</span>
      </div>
      <section id="recentProjects" class="recent-projects" aria-label="Recent projects" hidden>
        <h2>Recent projects</h2>
        <div id="recentProjectList" class="recent-project-list"></div>
      </section>
    </main>

    <footer class="statusbar">
      <span id="imageInfo">Image: -</span>
      <span class="zoom-control">
        <button id="zoomOut" type="button" title="Zoom out around center">-</button>
        <input id="zoomInfo" type="text" inputmode="numeric" aria-label="Zoom percentage" value="100%" />
        <button id="zoomIn" type="button" title="Zoom in around center">+</button>
      </span>
      <span id="cursorInfo">X: - Y: -</span>
      <button id="colorInfo" type="button" title="Copy HEX">Color: -</button>
      <span id="hintInfo">Guides: drag from rulers | Z: zoom tool | Space+drag: pan | Cmd/Ctrl/Alt+wheel: zoom | Esc: cancel</span>
    </footer>

    <script defer src="./js/core.js"></script>
    <script defer src="./js/project.js"></script>
    <script defer src="./js/interaction.js"></script>
    <script defer src="./js/render.js"></script>
    <script defer src="./js/events.js"></script>
  </body>
</html>
